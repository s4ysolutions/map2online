<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New trip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFC93C}a:hover{color:#FFE08A}
button{font:inherit;cursor:pointer}
input{font:inherit}
</style>
</helmet>
<div style="width: 100%; min-height: 900px; display: flex; flex-direction: column; background: #0E1114; color: #E6E9EC; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 16px">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px; padding: 0 24px; min-height: 56px; border-bottom: 1px solid #2A323B">
    <span style="display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#FFC93C" stroke-width="2" aria-hidden="true"><path d="M11 2l8 18-8-5-8 5z"></path></svg>
      Map2Online
    </span>
    <a href="#" style="color: #9AA4AE; text-decoration: none">My trips</a>
    <span style="color: #6F7A85">/</span>
    <span>New trip</span>
  </header>

  <div style="display: flex; flex-wrap: wrap; flex: 1">
    <form aria-labelledby="h-new" style="flex: 1 1 420px; max-width: 480px; display: flex; flex-direction: column; gap: 20px; padding: 24px; box-sizing: border-box; background: #161B21; border-right: 1px solid #2A323B">
      <h1 id="h-new" style="margin: 0; font-size: 30px; font-weight: 700">New trip</h1>

      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #9AA4AE; letter-spacing: 0.08em; text-transform: uppercase">Name
        <input type="text" value="Dolomites loop" style="min-height: 48px; padding: 0 12px; border-radius: 6px; border: 1px solid #FFC93C; background: #0E1114; color: #E6E9EC; font-size: 18px; text-transform: none; letter-spacing: 0"></label>

      <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
        <legend style="font-size: 13px; color: #9AA4AE; letter-spacing: 0.08em; text-transform: uppercase; padding: 0 0 6px">Dates</legend>
        <div style="display: flex; gap: 8px; align-items: center">
          <label style="flex: 1; display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">From</span>
            <input type="text" value="12.07.2027" style="flex: 1; min-width: 0; min-height: 44px; padding: 0 12px; border-radius: 6px; border: 1px solid #3A444F; background: #0E1114; color: #E6E9EC; font-family: 'JetBrains Mono', monospace"></label>
          <span style="color: #6F7A85">→</span>
          <label style="flex: 1; display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">To</span>
            <input type="text" value="16.07.2027" style="flex: 1; min-width: 0; min-height: 44px; padding: 0 12px; border-radius: 6px; border: 1px solid #3A444F; background: #0E1114; color: #E6E9EC; font-family: 'JetBrains Mono', monospace"></label>
        </div>
        <label style="display: flex; align-items: center; gap: 10px; font-size: 15px"><input type="checkbox" style="width: 18px; height: 18px; accent-color: #FFC93C">No dates yet</label>
      </fieldset>

      <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
        <legend style="font-size: 13px; color: #9AA4AE; letter-spacing: 0.08em; text-transform: uppercase; padding: 0 0 6px">Area</legend>
        <label style="display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search a place</span>
          <input type="search" value="Cortina d'Ampezzo" style="flex: 1; min-width: 0; min-height: 44px; padding: 0 12px; border-radius: 6px; border: 1px solid #3A444F; background: #0E1114; color: #E6E9EC"></label>
        <div style="font-size: 15px; color: #9AA4AE">or drag a box on the map. You can change it later.</div>
      </fieldset>

      <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
        <legend style="font-size: 13px; color: #9AA4AE; letter-spacing: 0.08em; text-transform: uppercase; padding: 0 0 6px">Start from</legend>
        <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; border-radius: 8px; border: 1px solid #FFC93C; background: #1B2128"><input type="radio" name="from" checked style="width: 18px; height: 18px; accent-color: #FFC93C">Empty trip</label>
        <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; border-radius: 8px; border: 1px solid #2A323B; background: #1B2128"><input type="radio" name="from" style="width: 18px; height: 18px; accent-color: #FFC93C">Import a KML / GPX file</label>
        <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; border-radius: 8px; border: 1px solid #2A323B; background: #1B2128"><input type="radio" name="from" style="width: 18px; height: 18px; accent-color: #FFC93C">Copy one of my trips</label>
      </fieldset>

      <div style="margin-top: auto; display: flex; gap: 8px">
        <button type="submit" style="flex: 2; min-height: 52px; border-radius: 6px; border: 0; background: #FFC93C; color: #0E1114; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em">Create and explore</button>
        <a href="#" style="flex: 1; min-height: 52px; border-radius: 6px; border: 1px solid #3A444F; color: #E6E9EC; text-decoration: none; display: flex; align-items: center; justify-content: center; text-transform: uppercase; letter-spacing: 0.06em">Cancel</a>
      </div>
    </form>

    <main style="flex: 999 1 560px; min-width: 0; min-height: 600px; position: relative; overflow: hidden; background: #0E1114">
      <svg viewBox="0 0 1000 800" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%" aria-hidden="true">
        <rect width="1000" height="800" fill="#0E1114"></rect>
        <g fill="none" stroke="#1E262E" stroke-width="1.2">
          <path d="M520,330 C520,250 600,220 650,240 C710,262 730,320 700,380 C670,440 560,430 530,380 Z"></path>
          <path d="M420,335 C410,170 600,120 710,150 C830,185 850,340 800,440 C745,545 520,535 450,450 Z"></path>
          <path d="M370,340 C350,130 600,70 740,105 C890,145 910,350 850,470 C780,600 500,590 410,490 Z"></path>
          <path d="M100,600 C90,480 220,440 310,460 C400,482 410,640 355,705 C300,770 120,750 100,600 Z"></path>
        </g>
        <ellipse cx="330" cy="250" rx="45" ry="22" fill="#14303A"></ellipse>
        <path d="M760,600 C800,580 860,590 870,620 C880,650 820,670 780,655 C750,645 735,615 760,600 Z" fill="#14303A"></path>
        <g fill="none" stroke="#2C3540" stroke-width="3">
          <path d="M0,520 C150,500 220,420 330,400 C450,380 480,300 560,180 C600,120 700,90 1000,80"></path>
          <path d="M330,400 C360,500 420,600 520,660 C620,720 800,700 1000,740"></path>
          <path d="M0,180 C120,200 200,240 285,250"></path>
        </g>
        <rect x="80" y="140" width="840" height="560" fill="#FFC93C" fill-opacity="0.05" stroke="#FFC93C" stroke-width="2" stroke-dasharray="10 6"></rect>
        <g fill="#FFC93C"><rect x="72" y="132" width="16" height="16"></rect><rect x="912" y="132" width="16" height="16"></rect><rect x="72" y="692" width="16" height="16"></rect><rect x="912" y="692" width="16" height="16"></rect></g>
        <circle cx="140" cy="520" r="7" fill="#E6E9EC"></circle>
        <text x="156" y="525" font-family="Barlow Semi Condensed, sans-serif" font-size="16" fill="#E6E9EC">Cortina d'Ampezzo</text>
      </svg>
      <div style="position: absolute; top: 16px; left: 16px; padding: 10px 14px; border-radius: 8px; background: #161B21; border: 1px solid #2A323B; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #C9D0D6">AREA 46 × 31 KM</div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
