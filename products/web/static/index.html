<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Map2Online</title>
    <meta name="theme-color" content="#1f2933" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
    <script>
      // API keys for background engines; Vite replaces %VITE_…% at build time
      // (an unset variable stays as-is and is treated as "not configured").
      window.MAP2_CONFIG = {
        googleMapsKey: "%VITE_GOOGLE_MAPS_KEY%",
        yandexMapsKey: "%VITE_YANDEX_MAPS_KEY%"
      };
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
